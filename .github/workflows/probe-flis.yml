name: Probe DLA catalog files (test only)
on:
  push:
    branches: [flis-probe]
    paths: [".github/workflows/probe-flis.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect TAB format
        run: |
          set +e
          mkdir -p probe; O=probe/flis4.txt; : > $O
          curl -sSL -o /tmp/dvd.zip https://publogstorage.blob.core.windows.net/publog/PublogDVD.zip
          cd /tmp && unzip -q -o /tmp/dvd.zip V_H6_NAME_INC.TAB V_CHARACTERISTICS.TAB V_FLIS_IDENTIFICATION.TAB "CHANGES/NIIN.zip" README* "*.TXT" 2>/dev/null
          for f in V_H6_NAME_INC.TAB V_FLIS_IDENTIFICATION.TAB V_CHARACTERISTICS.TAB; do
            echo "===== $f $(stat -c %s $f)" >> $GITHUB_WORKSPACE/$O
            file $f >> $GITHUB_WORKSPACE/$O
            head -c 256 $f | xxd | head -16 >> $GITHUB_WORKSPACE/$O
            echo "-- strings sample" >> $GITHUB_WORKSPACE/$O; strings -n 6 $f | head -25 | cut -c1-200 >> $GITHUB_WORKSPACE/$O
            echo "-- grep test NIIN / name" >> $GITHUB_WORKSPACE/$O; grep -aob "011775465\|BAG,CLOTH\|BAG, CLOTH" $f | head -5 >> $GITHUB_WORKSPACE/$O
          done
          echo "===== CHANGES/NIIN.zip" >> $GITHUB_WORKSPACE/$O; unzip -l CHANGES/NIIN.zip | head >> $GITHUB_WORKSPACE/$O
          for c in $(unzip -Z1 CHANGES/NIIN.zip | head -3); do echo "-> $c" >> $GITHUB_WORKSPACE/$O; unzip -p CHANGES/NIIN.zip "$c" | head -c 600 | strings | head -8 >> $GITHUB_WORKSPACE/$O; done
          ls /tmp/*.TXT /tmp/README* 2>/dev/null >> $GITHUB_WORKSPACE/$O
          true
      - name: Save report to this test branch
        if: always()
        run: |
          git config user.name bidpilot-bot; git config user.email actions@users.noreply.github.com
          git add probe/ && git commit -qm "FLIS probe report 4" && git pull -q --rebase origin flis-probe && git push -q origin HEAD:flis-probe
