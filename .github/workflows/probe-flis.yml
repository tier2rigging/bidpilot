name: Probe DLA catalog files (test only)
on:
  push:
    branches: [flis-probe]
    paths: [".github/workflows/probe-flis.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PUB LOG DVD contents
        run: |
          set +e
          mkdir -p probe; O=probe/flis3.txt; : > $O
          curl -sSL -o /tmp/dvd.zip https://publogstorage.blob.core.windows.net/publog/PublogDVD.zip
          echo "== entries outside HTML5/GRAPHICS, by size" >> $O
          unzip -l /tmp/dvd.zip | grep -vE " HTML5/| GRAPHICS/" | sort -k1 -n -r | head -60 >> $O
          mkdir -p /tmp/x && cd /tmp/x
          for m in $(unzip -Z1 /tmp/dvd.zip | grep -vE "^HTML5/|^GRAPHICS/|/$" | grep -iE "\.(zip|csv|txt|dat|imd|db|sqlite|mdb|idx)$" | head -40); do
            echo "--- $m" >> $O; unzip -p /tmp/dvd.zip "$m" > /tmp/inner 2>/dev/null; file /tmp/inner | cut -c1-200 >> $O
            if unzip -l /tmp/inner >/dev/null 2>&1; then unzip -l /tmp/inner | head -15 >> $O
              for c in $(unzip -Z1 /tmp/inner | grep -iE "\.(csv|txt)$" | head -5); do echo "   -> $c" >> $O; unzip -p /tmp/inner "$c" | head -3 | cut -c1-400 >> $O; unzip -p /tmp/inner "$c" | grep -aE "011775465|016659391" | head -5 | cut -c1-400 >> $O; done
            else head -c 300 /tmp/inner | strings | head -5 >> $O; grep -caE "011775465" /tmp/inner >> $O; fi
          done
      - name: Save report to this test branch
        run: |
          git config user.name bidpilot-bot; git config user.email actions@users.noreply.github.com
          git add probe/ && git commit -qm "FLIS probe report 3" && git pull -q --rebase origin flis-probe && git push -q origin HEAD:flis-probe
