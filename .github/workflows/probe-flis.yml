name: Probe DLA catalog files (test only)
on:
  push:
    branches: [flis-probe]
    paths: [".github/workflows/probe-flis.yml", "probe/relay/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 11cdc0918b9ff2df335c859f3d0b7c9d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test a Cloudflare relay to dla.mil
        working-directory: probe/relay
        run: |
          set +e
          O=$GITHUB_WORKSPACE/probe/flis6.txt; : > $O
          npm i -g wrangler@4 >/dev/null 2>&1
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API/workers/subdomain | jq -r '.result.subdomain // empty')
          echo "workers.dev subdomain: ${SUB:-none}" >> $O
          if [ -z "$SUB" ]; then curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"subdomain":"tier2rigging"}' $API/workers/subdomain | jq -c '{success,errors}' >> $O; SUB=tier2rigging; fi
          wrangler deploy >> $O 2>&1
          KEY=$(openssl rand -hex 16); printf '%s' "$KEY" | wrangler secret put RELAY_KEY >> $O 2>&1
          U="https://bidpilot-relay-test.$SUB.workers.dev"
          for i in $(seq 1 30); do c=$(curl -s -o /dev/null -w "%{http_code}" "$U/"); [ "$c" != "000" ] && break; sleep 10; done; echo "reachable after ~$((i*10))s (code $c)" >> $O
          for f in H-SERIES.zip IDENTIFICATION.zip CHARACTERISTICS.zip; do
            echo "== $f" >> $O
            curl -sS -o /tmp/$f -D /tmp/h -H "X-Relay-Key: $KEY" "$U/?f=$f" -w "http %{http_code} bytes %{size_download} time %{time_total}s\n" >> $O
            grep -iE "x-upstream" /tmp/h >> $O
            if unzip -l /tmp/$f >/dev/null 2>&1; then unzip -l /tmp/$f | head -8 >> $O
              for c in $(unzip -Z1 /tmp/$f | head -6); do echo "   -> $c header + sample" >> $O; unzip -p /tmp/$f "$c" | head -2 | cut -c1-500 >> $O; unzip -p /tmp/$f "$c" | grep -aE "011775465|BAG, TOOL|\"BAG, CLOTH" | head -4 | cut -c1-500 >> $O; done
            else head -c 300 /tmp/$f >> $O; echo >> $O; fi
          done
          wrangler delete --force >> $O 2>&1 || true
          true
      - name: Save report to this test branch
        if: always()
        run: |
          git config user.name bidpilot-bot; git config user.email actions@users.noreply.github.com
          git add probe/ && git commit -qm "FLIS relay probe report" && git pull -q --rebase origin flis-probe && git push -q origin HEAD:flis-probe
