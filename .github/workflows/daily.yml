name: Daily DIBBS update
on:
  schedule:
    - cron: "17 11,17 * * 1-5"   # weekdays ~7:17am and ~1:17pm Eastern (UTC 11:17 / 17:17)
  workflow_dispatch:
    inputs:
      days:
        description: "Days to pull (use 30 for first backfill)"
        default: "5"
permissions:
  contents: write
# Only one run at a time; a new run waits for the current one instead of overlapping.
concurrency:
  group: dibbs-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PDF reader
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
        continue-on-error: true
      - run: node ingest/fetch.mjs --days ${{ github.event.inputs.days || '5' }}
      - name: Collect awards
        timeout-minutes: 130
        run: node ingest/awards.mjs --days ${{ github.event.inputs.days == '30' && '30' || '7' }} --minutes 110
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "bidpilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "DIBBS update $(date -u +%F)"
          # Catch up with anything pushed during the run (your uploads), keep this run's data on conflicts.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
